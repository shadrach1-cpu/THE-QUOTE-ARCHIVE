<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page not found | The Quote Archive</title>
<script>
  // A quote or author added since the pages were last built has no page yet:
  // send the visitor to the same quote inside the app instead.
  (function(){
    var base = 'https://shadrach1-cpu.github.io/THE-QUOTE-ARCHIVE/';
    var m = location.pathname.match(/\/quote\/(\d+)\/?/);
    if (m) { location.replace(base + '?quote=SRV-' + m[1]); return; }
    if (/\/author\/\d+\/?/.test(location.pathname)) { location.replace(base + 'author/'); }
  })();
</script>
<link rel="stylesheet" href="https://shadrach1-cpu.github.io/THE-QUOTE-ARCHIVE/pages.css">
</head>
<body>
<header class="bar"><a class="brand" href="https://shadrach1-cpu.github.io/THE-QUOTE-ARCHIVE/">“ The Quote Archive</a></header>
<main>
  <h1>This page isn't in the archive</h1>
  <p class="lede">The link may be old or mistyped.</p>
  <p><a class="btn" href="https://shadrach1-cpu.github.io/THE-QUOTE-ARCHIVE/">Open the archive</a></p>
</main>
</body>
</html>
